<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vilaj Cupons</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body hidden>
<header class="topo">
  <div class="topo__dentro">
    <img class="topo__logo" src="img/logo.png" alt="Vilaj Coworking">
    <div class="topo__usuario">
      <span class="topo__email" id="usuario"></span>
      <button class="botao botao--escuro" id="sair" type="button">Sair</button>
    </div>
  </div>
</header>

<main class="painel">
  <!-- Validar cupom -->
  <section class="cartao" aria-labelledby="titulo-cupom">
    <div class="cartao__titulo">
      <h2 id="titulo-cupom"><span class="seta" aria-hidden="true">›››</span>Validar cupom</h2>
    </div>
    <p class="cartao__sub">Digite o código que o cliente recebeu por email.</p>

    <form class="consulta" id="form-cupom" autocomplete="off">
      <label class="visualmente-oculto" for="codigo">Código do cupom</label>
      <input class="campo" id="codigo" placeholder="NIVER-AB12CD" maxlength="20" spellcheck="false" autocapitalize="characters">
      <button class="botao" type="submit" id="consultar">Consultar</button>
    </form>

    <div class="resultado" id="resultado" aria-live="polite"></div>
  </section>

  <!-- Aniversariantes -->
  <section class="cartao" aria-labelledby="titulo-niver">
    <div class="cartao__titulo">
      <h2 id="titulo-niver"><span class="seta" aria-hidden="true">›››</span>Aniversariantes</h2>
      <span class="contador" id="contador"></span>
    </div>
    <p class="cartao__sub" id="hoje"></p>

    <div class="abas" role="tablist" aria-label="Período">
      <button class="aba" role="tab" aria-selected="true"  data-dias="0">Hoje</button>
      <button class="aba" role="tab" aria-selected="false" data-dias="7">Próximos 7 dias</button>
      <button class="aba" role="tab" aria-selected="false" data-dias="30">30 dias</button>
    </div>

    <div id="aniversariantes" role="tabpanel"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
